# Leadline CI — makes the local test gate automatic on every PR.
#
# CONTRIBUTING.md states: "There is no hidden CI magic yet: the suite you run
# locally is the gate." This workflow runs that exact same gate on GitHub's
# Linux runner so every push/PR proves the suite is green before review.
#
# Two constraints this file has to respect:
#
#   1. fetch-depth: 0 is LOAD-BEARING. The replay/provenance suites verify the
#      sealed exam runtime by reading its exact Git objects at commit 8488cb3
#      (see docs/EXAM.md). That commit is reachable only through the full ref
#      graph. actions/checkout defaults to a shallow, single-branch clone, which
#      resolves to one commit with no other refs, so `git rev-parse 8488cb3^{tree}`
#      fails and 7 provenance tests fail with "unknown revision". Do not
#      "optimise" this back to a shallow clone.
#
#   2. The corpus labeling harness (scripts/label-corpus.js) hard-requires Linux
#      (/proc/self/fd + O_NOFOLLOW), so the matrix stays on ubuntu-latest. The
#      router, the Claude Code hooks and `npm run bench` are platform-independent.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

jobs:
  test:
    name: npm test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node >= 18. Prove it rather than assert it.
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required: sealed-runtime provenance tests read Git objects at 8488cb3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Smoke the real init path
        shell: bash
        run: |
          set -euo pipefail
          dry_target="$(mktemp -d)/not-created"
          node ./bin/leadline.js init --claude-code --project "$dry_target" --mode advisory --dry-run > "$RUNNER_TEMP/leadline-init-preview.json"
          test ! -e "$dry_target"
          target="$(mktemp -d)"
          node ./bin/leadline.js init --claude-code --project "$target" --mode advisory > "$RUNNER_TEMP/leadline-init-result.json"
          node - "$target" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const target = process.argv[2];
          const settings = JSON.parse(fs.readFileSync(path.join(target, '.claude', 'settings.json'), 'utf8'));
          const events = ['UserPromptSubmit', 'PreToolUse', 'PostToolUse', 'Stop'];
          if (!events.every((event) => settings.hooks?.[event]?.length === 1)) process.exit(1);
          const config = fs.readFileSync(path.join(target, '.leadline', 'config.yaml'), 'utf8');
          if (!config.includes('mode: advisory')) process.exit(1);
          NODE

      - name: Run frozen benchmark
        run: npm run bench

  install-smoke:
    name: install smoke (clone + link)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Link CLI and verify the documented install path
        run: |
          npm link
          leadline --help || leadline init --claude-code --dry-run
          echo "install smoke OK"
