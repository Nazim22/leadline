# Leadline deterministic tells — Stage 1, high-precision only.
# Each tell: stable id, the family it contributes, phrases (matched case-insensitively;
# '*' = wildcard span), and terminal (alone decides) vs contributing (may combine).
# Conflicts NEVER silently fall through — two families matching → an ordered plan.
# Precision > recall here: a phrase belongs only if it is almost never the other family.
policy_version: route-v0.3

tells:
  # ---- historical: require a decision/ship/session verb, NOT bare "did we" ----
  - id: hist-decided
    family: historical
    terminal: true
    phrases: ["what did we decide", "what we decided", "why did we choose", "what did we settle on", "what was the decision"]
  - id: hist-shipped
    family: historical
    terminal: true
    phrases: ["did we ship", "have we shipped", "did we build", "what had we built", "did we already implement", "have we already"]
  - id: hist-session
    family: historical
    terminal: true
    phrases: ["where did we leave", "last session", "last time", "previously we", "what did we do"]

  # ---- structural ----
  - id: struct-callers
    family: structural
    terminal: true
    phrases: ["callers of", "who calls", "callees of", "who imports", "importers of", "references to", "depends on", "blast radius", "impact of", "implements", "where is * defined", "definition of"]

  # ---- repository: exact current bytes ----
  - id: repo-bytes
    family: repository
    terminal: true
    phrases: ["exact contents", "current contents", "show the file", "exact file", "exact implementation", "add a docstring", "what does line", "line * of", "exact line", "git diff", "show diff", "at commit", "literal value", "the bytes"]

  # ---- runtime: require a runtime noun or temporal/status qualifier ----
  - id: runtime-state
    family: runtime
    terminal: true
    phrases: ["running now", "currently deployed", "is deployed", "is it live", "it is live", "which version is live", "what version is deployed", "health endpoint", "is * responding", "responding now", "alive now", "live right now", "port * open", "is the * up"]

# Clause-scoped exclusions. When a clause contains an exclude phrase, the named family
# is suppressed FOR THAT CLAUSE only — not a global abstention.
# e.g. "tell me what we decided, but don't check whether it's deployed" → historical only.
negatives:
  - id: neg-not-runtime
    excludes: runtime
    when_clause_contains: ["don't check runtime", "do not check runtime", "skip runtime check", "without checking runtime", "don't check whether it's deployed", "don't check whether it's currently deployed", "do not check whether it's deployed", "do not check whether it's currently deployed", "don't check if it's deployed", "don't check if it's currently deployed", "do not check if it's deployed", "do not check if it's currently deployed", "don't verify deployment", "do not verify deployment", "not asking whether it's live", "no need to check whether it's live"]
    scope: clause
